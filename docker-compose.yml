services:
  inference:
    build:
      context: ./inference
      dockerfile: Dockerfile
    # ports:
    #   - "8001:8001"
    volumes:
      - ./logs:/app/logs
    restart: always

  apigw:
    build:
      context: ./apigw
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    depends_on:
      - inference
      - database
      - catch_db
    restart: always

  database:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    # Uncomment for examination only
    # ports:
    #   - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
  catch_db:
    image: redis:7-alpine
    restart: always
    # ports:
    #   - "6380:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
