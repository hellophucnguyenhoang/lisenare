[project]
name = "lisenare-inference"
version = "0.1.0"
description = "Server dedicated to AI model inference"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "en-core-web-sm",
    "fastapi[standard]>=0.120.1",
    "fastdtw>=0.3.4",
    "ffmpeg-python>=0.2.0",
    "fugashi[unidic-lite]>=1.5.2",
    "httpx>=0.28.1",
    "jaconv>=0.5.0",
    "jiwer>=4.0.0",
    "kokoro>=0.9.4",
    "mojimoji>=0.0.13",
    "mutagen>=1.47.0",
    "nltk>=3.9.1",
    "numpy>=2.3.4",
    "openpyxl>=3.1.5",
    "phonemizer>=3.4.0",
    "pip>=25.3",
    "psycopg2-binary>=2.9.12",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.11.0",
    "pyenchant>=3.3.0",
    "pyjwt>=2.10.1",
    "pyopenjtalk>=0.4.1",
    "pystemmer>=3.1.0",
    "pytest>=9.0.2",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.20",
    "sentence-transformers>=5.1.2",
    "soundfile>=0.13.1",
    "spacy>=3.8.9",
    "sqlmodel>=0.0.27",
    "textstat>=0.7.12",
    "tzdata>=2025.2",
    "wordfreq>=3.1.1",
]

[project.optional-dependencies]
cpu = [
    "torch==2.9.0",
    "torchaudio==2.9.0",
    "torchcodec==0.9.0",
]

cu128 = [
    "torch==2.9.0",
    "torchaudio==2.9.0",
    "torchcodec==0.9.0",
]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu128" },
    ],
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
]

torchaudio = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 79

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
