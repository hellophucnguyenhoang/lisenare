[project]
name = "lisenare-apigw"
version = "0.1.0"
description = "API gateway responsible for routing and coordinating services"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "apscheduler>=3.11.0",
    "boto3>=1.43.99",
    "en-core-web-sm",
    "fakeredis>=2.35.1",
    "fastapi-mail>=1.6.8",
    "fastapi[standard]>=0.120.1",
    "fastdtw>=0.3.4",
    "ffmpeg-python>=0.2.0",
    "fsrs>=6.3.0",
    "httpx>=0.28.1",
    "jaconv>=0.5.0",
    "jiwer>=4.0.0",
    "langchain-ollama>=1.0.1",
    "langchain-postgres>=0.0.17",
    "numpy>=2.3.4",
    "ollama>=0.6.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pip>=25.3",
    "psycopg2-binary>=2.9.12",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.11.0",
    "pyjwt>=2.10.1",
    "pystemmer>=3.1.0",
    "pytest>=9.0.2",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.20",
    "redis>=7.1.0",
    "spacy>=3.8.9",
    "sqlmodel>=0.0.27",
    "textstat>=0.7.12",
    "tzdata>=2025.2",
    "wordfreq>=3.1.1",
]

[tool.ruff]
line-length = 79

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]


[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
